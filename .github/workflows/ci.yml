# Depends: package.json, .nvmrc, docker/Dockerfile
# EnumType: Workflow
# EnumEdges: DEPENDS_ON package.json; DEPENDS_ON .nvmrc; DEPENDS_ON docker/Dockerfile
# DAG Node: none
# Intent: Apply the pinned runtime and strict typecheck gate while preserving CI publication boundaries.

name: CI — guild-research
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/citadel-nexus/guild-research:latest
